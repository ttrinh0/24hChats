services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "LocalChat_TestOnly_2026"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - chat_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  chat_sql_data: